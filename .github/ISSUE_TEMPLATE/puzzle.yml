name: パズルの自動追加
description: テストプレイを通した問題JSONを送信します
title: "[Puzzle] "
body:
  - type: markdown
    attributes:
      value: "条件は初手だけ屋根作り可能、以降すべて特殊スピン。1手なら特殊スピン必須です。入力ログを自動再生検証し、通った問題はレビューなしで公開します。重複盤面は追加しません。"
  - type: textarea
    id: puzzle
    attributes:
      label: 問題JSON
      description: ゲームの「送信用JSONをコピー」を押し、全文を貼り付けてください。盤面と攻略例は公開されます。
      render: json
    validations:
      required: true
